name: Metal Edition Docker image

on:
  push:
    branches: [metal-edition, metal-stable]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two release channels:
      #   metal-edition -> :latest  (staging)
      #   metal-stable  -> :stable  (production)
      - name: Compute image tags
        id: image
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/navidrome-metal"
          if [ "${GITHUB_REF_NAME}" = "metal-stable" ]; then
            echo "tags=${NAME}:stable,${NAME}:stable-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${NAME}:latest,${NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

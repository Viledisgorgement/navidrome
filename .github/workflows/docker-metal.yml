name: Metal Edition Docker image

on:
  push:
    branches: [metal-edition, metal-stable]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Portainer cannot clone this repo (upstream test fixtures contain
  # symlinks, which newer Portainer rejects), so the stacks point at tiny
  # deploy-only branches instead. Keep them in sync with each channel:
  #   metal-edition -> stacks-staging
  #   metal-stable  -> stacks-stable
  sync-stack-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push deploy folder to the channel's stacks branch
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          BRANCH=stacks-staging
          if [ "${GITHUB_REF_NAME}" = "metal-stable" ]; then
            BRANCH=stacks-stable
          fi
          TREE=$(git ls-tree HEAD deploy | git mktree)
          COMMIT=$(echo "Portainer stack files from ${GITHUB_REF_NAME} ${GITHUB_SHA}" | git commit-tree "$TREE")
          git push -f origin "$COMMIT:refs/heads/$BRANCH"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two release channels:
      #   metal-edition -> :latest  (staging)
      #   metal-stable  -> :stable  (production)
      - name: Compute image tags
        id: image
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/navidrome-metal"
          if [ "${GITHUB_REF_NAME}" = "metal-stable" ]; then
            echo "tags=${NAME}:stable,${NAME}:stable-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${NAME}:latest,${NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
